<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-bg { fill: url(#grid); }
    
    /* Animations */
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-15px) scale(1.1); opacity: 0.7; }
      100% { transform: translateY(0px) scale(1); opacity: 0.3; }
    }
    
    @keyframes pulseNode {
      0%, 100% { r: 6px; opacity: 0.6; }
      50% { r: 9px; opacity: 1; filter: drop-shadow(0 0 6px #818cf8); }
    }

    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }

    .particle { animation: floatParticle 6s ease-in-out infinite; }
    .particle-delay { animation: floatParticle 8s ease-in-out infinite 2s; }
    .node { animation: pulseNode 3s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 8 8; animation: dashFlow 2s linear infinite; }
    
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: url(#titleGrad);
    }

    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #e2e8f0;
      letter-spacing: 0.5px;
    }

    .badge-bg {
      fill: #1e293b;
      stroke: #475569;
      stroke-width: 1.5px;
      rx: 20px;
    }

    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #94a3b8;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="350" class="bg" />
  <rect width="1200" height="350" class="grid-bg" />

  <!-- Dynamic / Animated Background Vector Graphics (Behind Text) -->
  <!-- Floating Orbs -->
  <circle cx="150" cy="80" r="120" fill="url(#glowGrad)" class="particle" />
  <circle cx="1050" cy="270" r="160" fill="url(#glowGrad)" class="particle-delay" />

  <!-- Neural Network Connections Background Layer (Opacity low so foreground pops) -->
  <g opacity="0.25">
    <!-- Connecting paths -->
    <path d="M 100 280 Q 250 320 400 280 T 700 290 T 1000 260" fill="none" stroke="#6366f1" stroke-width="2" class="flow-line" />
    <path d="M 150 70 Q 350 40 600 70 T 1100 80" fill="none" stroke="#a855f7" stroke-width="2" class="flow-line" />
    
    <!-- Nodes -->
    <circle cx="100" cy="280" r="6" fill="#38bdf8" class="node" />
    <circle cx="400" cy="280" r="6" fill="#818cf8" class="node" />
    <circle cx="700" cy="290" r="6" fill="#c084fc" class="node" />
    <circle cx="1000" cy="260" r="6" fill="#f472b6" class="node" />
  </g>

  <!-- Foreground Pill Highlights (Lowered and styled) -->
  <g transform="translate(310, 50)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="36" class="badge-bg" />
    <text x="80" y="23" text-anchor="middle" class="badge-text">Intent Recognition</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="150" height="36" class="badge-bg" />
    <text x="250" y="23" text-anchor="middle" class="badge-text">Entity Extraction</text>

    <!-- Pill 3 -->
    <rect x="340" y="0" width="120" height="36" class="badge-bg" />
    <text x="400" y="23" text-anchor="middle" class="badge-text">Transformers</text>

    <!-- Pill 4 -->
    <rect x="475" y="0" width="105" height="36" class="badge-bg" />
    <text x="527" y="23" text-anchor="middle" class="badge-text">LLM APIs</text>
  </g>

  <!-- FOREGROUND TEXT (High Contrast & Clear) -->
  <g transform="translate(600, 160)">
    <!-- Main Title -->
    <text x="0" y="0" text-anchor="middle" class="title-text" filter="url(#glow)">
      Awesome Natural Language Understanding
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="45" text-anchor="middle" class="subtitle-text">
      Curated Directory of Commercial NLU APIs &amp; State-of-the-Art Open-Source NLP Frameworks
    </text>
  </g>

  <!-- Decorative Bottom Accent Line -->
  <rect x="300" y="270" width="600" height="3" rx="1.5" fill="url(#titleGrad)" opacity="0.8" />
</svg>
